<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIX Decoder</title>
  <script src="DecodeFix.js" defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: monospace;
    }

    body {
      background-color: #122c46;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      color: orange;
    }

    .MainBox {
      width: 99vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
    }

    .Box {
      border: 1px solid orange;
      width: 30%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .Box:focus {
      border-color: orange;
      box-shadow: 0 0 20px orange;
    }

    .Box textarea {
      width: 100%;
      height: 20%;
      font-size: 20px;
    }

    .btns {
      margin: 10px;
      display: flex;
      justify-content: end;
      gap: 20px;
    }

    .btns button {
      width: 100px;
      height: 25px;
      font-size: 15px;
      border: none;
      border-radius: 5px;
    }

    .Box button:hover {
      width: 110px;
      height: 30px;
      border: 2px solid white;
    }

    .tagDescription {
      flex: 1; /* take remaining space */
      overflow-y: auto; /* scrollable */
      display: flex;
      flex-direction: column;
    }

    .records {
      margin: 0;
      color: black;
      width: 100%;
      font-size: 18px;
      border-bottom: 1px solid black;
      font-weight: bold;
      padding: 5px;
    }

    .records.even {
      background-color: #74b1ee;
    }

    .records.odd {
      background-color: #BDDDFC;
    }

    .records:hover {
      background-color: rgba(255, 166, 0, 0.932);
      color: black;
      cursor: pointer;
    }

    .submit {
      background-color: greenyellow;
    }

    .clear {
      background-color: rgb(230, 42, 42);
      color: white;
    }
  </style>
</head>

<body>
  <h1>FIX Message Decoder</h1>
  <div class="MainBox">

    <div class="Box" tabindex="0">
      <textarea placeholder="Fix Message..." id="inputA"></textarea>
      <section class="btns">
        <button onclick="convertMessage('inputA','outputA')" class="submit">Submit</button>
        <button class="clear" onclick="clearTextArea('inputA','outputA')">Clear</button>
      </section>
      <section class="tagDescription" id="outputA"></section>
    </div>

    <div class="Box" tabindex="0">
      <textarea placeholder="Fix Message..." id="inputB"></textarea>
      <section class="btns">
        <button onclick="convertMessage('inputB','outputB')" class="submit">Submit</button>
        <button class="clear" onclick="clearTextArea('inputB','outputB')">Clear</button>
      </section>
      <section class="tagDescription" id="outputB"></section>
    </div>

    <div class="Box" tabindex="0">
      <textarea placeholder="Fix Message..." id="inputC"></textarea>
      <section class="btns">
        <button onclick="convertMessage('inputC','outputC')" class="submit">Submit</button>
        <button class="clear" onclick="clearTextArea('inputC','outputC')">Clear</button>
      </section>
      <section class="tagDescription" id="outputC"></section>
    </div>

  </div>

</body>

</html>
