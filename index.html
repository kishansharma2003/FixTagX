<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>Index Page</title>
    <link rel="stylesheet" href="/customFix.css">
    <script src="customFix.js" defer></script>
</head>

<body>
    <div class="Nav">

        <div class="A">
            <section id="Fix_Convertor">
                <i class="fa-solid fa-shuffle" onclick="updateIframe('/InnerHtml/DecodeFix.html')"></i>
                <p>Decode Fix</p>
            </section>

            <section id="Find_Fix">
                <i class="fa-solid fa-magnifying-glass" onclick="updateIframe('/InnerHtml/Find_your_fix.html')"></i>
                <p>Find your Fix </p>
            </section>

            <section id="Epoch_Conversion">
                <i class="fa-regular fa-clock" onclick="updateIframe('/InnerHtml/Epoch_Convertor.html')"></i>
                <p>Epoch Conversion </p>
            </section>

            <section id="Todo">
                <i class="fa-solid fa-clipboard-list" onclick="updateIframe('/InnerHtml/toDoList.html')"></i>
                <p>Todo List</p>
            </section>


            <section id="download">
                <a href="/InnerHtml/fixTag.json" download>
                    <i class="fa-solid fa-download"></i>
                    <p>Download Fix.json</p>
                </a>
            </section>

            <section id="userInputFile">
                <input type="file" id="jsonUploader" accept=".json" style="display:none">
                <i class="fa-solid fa-upload" onclick="triggerUpload()"></i>
                <p>Upload Custom JSON</p>
                <span class="Tool-Tip">**Refresh requried after Upload</span>
            </section>

            <section>
                <p id="uploadStatus"></p>
            </section>
        </div>
    </div>

    <div class="mainContainer">
        <iframe src="" frameborder="0" id="innerFrame">

        </iframe>
    </div>

    <footer>
        <i class="fa-regular fa-copyright"></i>
        <span>All rights reserved to Kishan Sharma</span>
    </footer>

</body>

</html>
